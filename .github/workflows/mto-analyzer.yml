name: MTO Analyzer Pipeline

on:
  schedule:
    # Once a day, ~09:30 Madrid, weekdays (plus on-demand via workflow_dispatch)
    - cron: "30 7 * * 1-5"
  workflow_dispatch:

concurrency:
  group: mto-analyzer
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r automation/requirements.txt pytest
      - run: python -m pytest tests/ -q

  run-pipeline:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GMAIL_CONFIGURED: ${{ secrets.GMAIL_REFRESH_TOKEN != '' }}
    steps:
      - name: Skip — secrets not configured yet
        if: env.GMAIL_CONFIGURED != 'true'
        run: echo "GMAIL_* secrets are not set — skipping the pipeline (this is not an error)."
      - uses: actions/checkout@v4
        if: env.GMAIL_CONFIGURED == 'true'
      - uses: actions/setup-python@v5
        if: env.GMAIL_CONFIGURED == 'true'
        with:
          python-version: "3.11"
          cache: "pip"
      - if: env.GMAIL_CONFIGURED == 'true'
        run: pip install -r automation/requirements.txt
      - name: Run MTO pipeline
        if: env.GMAIL_CONFIGURED == 'true'
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_APP_SECRET: ${{ secrets.GMAIL_APP_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: python automation/mto_pipeline.py
